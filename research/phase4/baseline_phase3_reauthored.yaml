conversations:
- id: intro
  speaker: victoria
  entry: opening
  nodes:
  - id: opening
    lines:
    - speaker: victoria
      text: Londres guarda secretos. ¿Quieres saber quién soy?
    choices:
    - text: ¿Quién eres?
      goto: identity
    - text: Me voy.
      result: 2
  - id: identity
    lines:
    - speaker: victoria
      text: Me llaman Victoria. Necesito un aliado para esta noche.
    choices:
    - text: Cuenta conmigo.
      result: 3
      set_flag: alliance
    - text: No quiero involucrarme.
      result: 4
- id: ally
  speaker: victoria
  entry: opening
  nodes:
  - id: opening
    lines:
    - speaker: victoria
      text: Recuerdo nuestro pacto. Gracias por volver.
    choices:
    - text: Seguimos juntos.
      result: 1
    - text: El pacto termina aquí.
      result: 2
      clear_flag: alliance
events:
- id: event1
  when: scene_start
  actions:
  - spawn: victoria
  - spawn: object1
- id: greet_new
  when: actor_clicked
  actions:
  - start_conversation: intro
  actor: victoria
  conditions:
  - flag: alliance
    is_set: false
- id: greet_ally
  when: actor_clicked
  actions:
  - start_conversation: ally
  actor: victoria
  conditions:
  - flag: alliance
    is_set: true
- id: event2
  when: trigger_enter
  trigger: trigger1
  conditions:
  - flag: alliance
    is_set: true
  actions:
  - set_flag: entered
  - spawn: actor1
