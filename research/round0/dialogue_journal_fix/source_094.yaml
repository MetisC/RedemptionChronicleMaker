      - 180
  conversations:
  - id: menu
    speaker: mentor
    camera: native
    entry: opening
    nodes:
    - id: opening
      lines:
      - speaker: mentor
        text: Bienvenido. Cada personaje es una estación del tutorial. Inicia la quest, habla con cineasta y custodia
          y lleva una llave a la guardiana. El otro layout usa exactamente este mismo calle.
      choices:
      - text: Iniciar quest y activar el flag de acceso.
        result: 1
      - text: ¿Dónde se edita todo esto?
        result: 2
      - text: 'Herramientas: AI, movimiento, prop y flag.'
        goto: tools
      - text: Cerrar y volver después.
        result: 3
    - id: tools
      lines:
      - speaker: mentor
        text: Estas acciones afectan al caminante y al barril. Puedes repetir pausa/reanudar; retirar el barril
          es permanente para esta partida.
      choices:
      - text: Pausar AI del caminante.
        result: 4
      - text: Reanudar AI del caminante.
        result: 5
      - text: Detener recorrido.
        result: 6
      - text: Iniciar recorrido.
        result: 7
      - text: Retirar barril.
        result: 8
      - text: Desactivar flag ready.
        result: 9
      - text: Volver al menú.
        goto: opening
  - id: camera
    speaker: camera
    prompt: 'Puedes comparar la cámara automática del juego, un plano propio, una cutscene con caminante y tres
      planos, o el travelling original EASTOttoVan. La última opción es experimental: no hemos creado ese recorrido.'
    camera: native
    choices:
    - text: Diálogo con plano propio.
      result: 1
    - text: 'Cutscene: caminante y tres planos, 8 segundos.'
      result: 2
    - text: Travelling original, 8 segundos.
      result: 3
    - text: Cerrar.
      result: 4
  - id: framed
    speaker: camera
    prompt: Este diálogo usa el preset sobre el hombro. En el editor selecciona la conversación y cambia Cámara
      de diálogo; Automática deja que decida el motor.
    camera: ots_speaker
    choices:
    - text: Volver a los controles.
      result: 1
    - text: Terminar.
      result: 2
  - id: inventory
    speaker: keeper
    prompt: Mi inventario inicial contiene una llave y un libro; selecciónalos en el editor, Editar inventario inicial,
      + Del catálogo. Para la salida te doy una llave distinta.
    camera: native
    choices:
    - text: Recibir la llave del jugador.
      result: 1
    - text: Cerrar.
      result: 2
  - id: gate
    speaker: gate
    prompt: Para entrar en el layout de combate necesitas iniciar la quest y llevar la llave. El combate es una
      sola rata básica de las primeras minas; sólo aparece en el otro layout. Si te falta algo, vuelve a mentora
      o custodia.
    camera: native
    choices:
    - text: Abrir salida lógica con flag Y objeto; cambiar layout.
      result: 1
    - text: Cerrar.
      result: 2
  - id: help
    speaker: mentor
    prompt: 'Tutorial / Ayuda contiene enlaces a cada entidad y los pasos exactos del editor. Las puertas físicas
      originales y el writer de travelling NCP siguen pendientes: no son funciones completas.'
    camera: native
    choices:
    - text: Volver.
      result: 1
    - text: Cerrar.
      result: 2
  events:
