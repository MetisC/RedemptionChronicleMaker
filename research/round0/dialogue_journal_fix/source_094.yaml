    conversation: camera
    result: 3
  - id: key
    when: conversation_ended
    actions:
    - give_item: key
    - set_flag: has_key
    conversation: inventory
    result: 1
    once: true
  - id: unlock
    when: conversation_ended
    actions:
    - set_flag: unlocked
    - travel:
        scene: combat
        entry: safe
    conversation: gate
    result: 1
    once: false
    conditions:
    - all:
