  - id: zone_left
    when: trigger_leave
    actions:
    - set_flag: left_zone
    trigger: station
    once: false
  - id: timer
    when: timer
    actions:
    - set_flag: timer_done
    seconds: 4
  - id: key_seen
    when: state_changed
    actions:
    - set_flag: ready
    conditions:
    - all:
      - flag: has_key
        is_set: true
      - any:
        - flag: access
          is_set: true
        - not:
            flag: picked_up
            is_set: true
  - id: tool0
    when: conversation_ended
