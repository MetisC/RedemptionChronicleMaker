quests:
- id: lesson
  title: Aprender a crear
  description: Completa el circuito del taller.
  steps:
  - Habla con 01 Mentora y acepta la lección. Después prueba 02 Cineasta y recibe la llave de 03 Custodia.
  - Con acceso y llave, habla con 04 Guardiana. En el nuevo layout puedes volver al taller sin combatir. Para avanzar
    al final, crea y mata la rata.
  - Viaja al final y habla con la mentora para completar la lección.
  reward_xp: 20
- id: guide
  title: 'Tutorial RCM: empieza aquí'
  description: 'Empieza hablando con 01 Mentora, muy cerca de tu llegada: acepta la lección para activar el flag
    de acceso. 02 Cineasta: compara cámara automática y plano propio; prueba la cutscene de ocho segundos con caminante
    y tres planos. El travelling original es una prueba experimental independiente. 03 Custodia: recibe la llave;
    su inventario inicial contiene otra llave y un libro. 04 Guardiana: con acceso y llave te lleva al layout de
    combate sobre la misma geometría. 05 Caminante: observa el recorrido entre waypoints. El trigger cercano crea
    un libro recogible al entrar; prueba entrar, salir y recogerlo. En el segundo layout habla con la guía: puedes
    volver al taller sin combatir. Para completar la lección, crea la rata, mátala y pide viajar al final. Guarda,
    carga y regresa al taller: deben conservarse flags, inventario y quests sin duplicar premios. En el editor:
    Espacio 3D > Inicio muestra la llegada; Entradas cambia XYZ y orientación. Selecciona una conversación para
    editar respuestas y Cámara de diálogo; Automática del juego deja decidir al motor. Campaña / Quests permite
    editar quests, escenas, waypoints, recorridos y secuencias de planos. + Escena > Nuevo layout vacío reutiliza
    la geometría con otros actores y objetos. En Propiedades de un actor > Editar inventario inicial > + Del catálogo
    añades objetos. Tutorial / Ayuda enlaza cada estación y explica flags, eventos, audio, AI y recursos propios.
    Las puertas físicas completas y crear nuevos travellings NCP siguen pendientes; aquí se demuestra una salida
    lógica con flag y llave.'
  steps:
  - Habla con 01 Mentora, junto al punto de inicio. La descripción de esta entrada explica todo el circuito.
resources:
