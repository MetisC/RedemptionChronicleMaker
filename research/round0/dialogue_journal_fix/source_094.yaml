    transform:
      placement: absolute
      position:
      - -62.0
      - -768.0
      - 368.0
      orientation:
      - 0
      - 0
      - 180
  - id: npc_book
    name: Libro en inventario de la custodia
    template: ledger
    transform:
      placement: absolute
      position:
      - -62.0
      - -768.0
      - 368.0
