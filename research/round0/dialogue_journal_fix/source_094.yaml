schema: 2
project_format: 9
chronicle:
  id: rcm_tutor
  name: RCM · Tutorial de creación
  description: Un único level, tres layouts. Estaciones de autoría, cine, inventario, llave, flags, quest y rata
    opcional.
entry: workshop
state:
  flags:
    access: 1
    has_key: 2
    unlocked: 3
    entered_zone: 4
    picked_up: 5
    left_zone: 6
    timer_done: 7
    ready: 8
    combat_done: 9
    rat_killed: 10
    finished: 11
scenes:
- id: workshop
  level:
