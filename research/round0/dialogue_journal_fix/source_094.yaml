    base: civilian
    properties:
      wanderRadius: 0
  scripts:
  - id: RCMTutorActor
    source: chronicles/tutorial/resources/RCMTutorActor.java
  textures: []
metadata:
  author: RCM
  version: 0.9.4
  description: Estaciones editables. Nuevas cámaras y recorridos requieren prueba manual en motor.
  requires_game: Redemption 1.1
  dependencies: []
build_options:
  debug: true
playtests:
- id: tutorial
  name: Tutorial · un único level
  instructions: 'El journal carga Tutorial RCM: empieza aquí al llegar, antes de crear NPC. Abre Tutorial / Ayuda
    en el editor. Mentora inicia lección; cineasta compara cámaras; custodia da llave; guardiana cambia layout;
    guía crea una rata si lo eliges o vuelve al taller; final completa quest. Guarda/carga y reentra. Comparar UI/cámara,
    inventario, planos, rutas, sonido, flags y premios. No aceptar el travelling original o puertas como verificados
    sin probarlos.'
