schema: 1
chronicle:
  id: east_demo
  name: "Redemption Chronicle Maker: Londres nuevo"

# Geometry is a reference to the catalogue, never an edited/generated NIL.
level:
  source: EastLondon
  # Keep the original environment; no added sky model.
  # Both native EastLondon comparison cases show the original grey background.

state:
  flags:
    alliance: 1

actors:
  - id: victoria
    template: businessWoman
    name: Victoria
    transform:
      # The engine chooses a valid adjacent point after a player arrives.
      placement: near_player
      # Codex uses pitch, roll, yaw. The third component is heading.
      orientation: [0, 0, 180]
    conversation:
      default: intro
      when_flag: alliance
      then: ally

conversations:
  - id: intro
    speaker: victoria
    prompt: "Esta noche podemos cambiar Londres. ¿Trabajamos juntos?"
    choices:
      - text: "Sí. Cuenta conmigo."
        result: 1
        set_flag: alliance
      - text: "Prefiero seguir por mi cuenta."
        result: 2
        clear_flag: alliance
  - id: ally
    speaker: victoria
    prompt: "Recuerdo nuestro acuerdo. Ahora tengo una aliada en Londres."
    choices:
      - text: "Seguimos juntos."
        result: 1
        set_flag: alliance
      - text: "Doy por terminado el acuerdo."
        result: 2
        clear_flag: alliance

events:
  - when: scene_start
    actions:
      - spawn: victoria
