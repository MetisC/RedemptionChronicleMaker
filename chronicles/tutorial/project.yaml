  conversations:
  - id: menu
    speaker: mentor
    camera: ots_speaker_close
    prompt: 'Bienvenido. Soy Tomás y te acompañaré al empezar. No hace falta que recorras Londres buscando a los
      demás: cada profesor vendrá a esta misma esquina. El journal te recordará qué toca hacer. Si quieres cambiar
      dónde empieza tu personaje, abre Espacio 3D > Inicio en el editor y mueve la entrada safe. ¿Seguimos con Vera?'
    choices:
    - text: Sí, vamos con Vera.
      result: 1
    - text: Omitir esta parte y continuar.
      result: 2
  - id: camera
    speaker: camera
    camera: ots_speaker_close
    prompt: 'Hola, soy Vera. Vamos a ver cómo cambia una conversación según dónde pongamos la cámara. Te enseñaré
      los planos uno a uno: pulsa Siguiente cuando quieras cambiar y tómate el tiempo que necesites. En el editor
      están en Cámara de diálogo, al seleccionar la conversación. El plano sobre el hombro es el que usamos por
      defecto.'
    choices:
    - text: Enséñame los planos.
      result: 1
    - text: Omitir esta parte y continuar.
      result: 2
  - id: framed
    speaker: camera
    camera: ots_speaker_close
    prompt: '1 de 13 · Sobre hombro cercano hacia quien habla. Estamos sobre tu hombro, cerca de Vera. Ves a quien
      habla y un poco de quien escucha: es nuestro plano habitual.'
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_2
    speaker: camera
    camera: speaker_extreme
    prompt: 2 de 13 · Primerísimo primer plano de quien habla. Ahora nos acercamos mucho al rostro de Vera. Va bien
      para una reacción importante, pero puede resultar demasiado intenso para una charla larga.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_3
    speaker: camera
    camera: listener_extreme
    prompt: 3 de 13 · Primerísimo primer plano de quien escucha. Este mismo acercamiento mira ahora a tu personaje.
      Sirve para enseñar su reacción mientras escucha.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_4
    speaker: camera
    camera: speaker_close
    prompt: 4 de 13 · Primer plano de quien habla. Este es un primer plano de Vera. Su rostro tiene el protagonismo;
      suele funcionar bien en los diálogos.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_5
    speaker: camera
    camera: listener_close
    prompt: 5 de 13 · Primer plano de quien escucha. Ahora el primer plano es de tu personaje. Puedes alternar entre
      quien habla y quien escucha.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_6
    speaker: camera
    camera: ots_listener_close
    prompt: '6 de 13 · Sobre hombro cercano hacia quien escucha. Hemos pasado al otro hombro: miramos hacia tu personaje
      desde el lado de Vera.'
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_7
    speaker: camera
    camera: ots_speaker
    prompt: 7 de 13 · Sobre hombro hacia quien habla. Volvemos a mirar a Vera sobre tu hombro, pero con algo más
      de espacio alrededor.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_8
    speaker: camera
    camera: ots_listener
    prompt: 8 de 13 · Sobre hombro hacia quien escucha. El mismo plano más abierto, desde el hombro de Vera hacia
      tu personaje.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_9
    speaker: camera
    camera: profile_speaker
    prompt: 9 de 13 · Perfil de quien habla. Vemos a Vera de perfil. Un cambio lateral puede dar variedad a una
      conversación.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_10
    speaker: camera
    camera: profile_listener
    prompt: 10 de 13 · Perfil de quien escucha. Aquí vemos de perfil a tu personaje. Es la otra mitad del plano
      anterior.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_11
    speaker: camera
    camera: two_shot
    prompt: 11 de 13 · Dos personajes. Ahora entráis los dos en el encuadre. Este plano ayuda a mostrar la distancia
      y la relación entre ambos.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_12
    speaker: camera
    camera: medium
    prompt: 12 de 13 · Plano medio. El plano medio deja ver más del cuerpo y de la calle. Es útil si importan los
      gestos o el lugar donde habláis.
    choices:
    - text: Siguiente plano.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: frame_13
    speaker: camera
    camera: full
    prompt: 13 de 13 · Plano entero. Nos alejamos para ver el cuerpo entero. Así puedes mostrar a los personajes
      dentro del escenario. Eso es todo. Puedes elegir el que más te guste en Cámara de diálogo. Anezka nos espera
      para enseñarnos una escena con movimiento.
    choices:
    - text: Ya los he visto. Vamos con Anezka.
      result: 1
    - text: Omitir los demás planos y continuar.
      result: 2
  - id: cinema
    speaker: director
    camera: ots_speaker_close
    prompt: 'Soy Anezka. Vamos a contar una pequeña historia sin movernos de esta calle: alguien espera detrás de
      una puerta, la puerta se levanta y le deja pasar. Verás el lugar, la apertura y su paseo desde varios planos.
      Dura doce segundos. En Cámaras > walk_scene puedes cambiar los planos, cuándo se abre la puerta y cuándo empieza
      a caminar el personaje. ¿La vemos?'
    choices:
    - text: Sí, vamos a verla.
      result: 1
    - text: Omitir esta parte y continuar.
      result: 2
  - id: inventory
    speaker: keeper
    camera: ots_speaker_close
    prompt: 'Hola, soy Elena. Llevo una llave y un libro; puedes preparar lo que lleva cualquier personaje en Editar
      inventario inicial > + Del catálogo. Voy a darte una llave. Mira después tu inventario: un evento puede comprobar
      si la tienes para dejarte pasar. Si prefieres omitirlo, te la daré igualmente para que puedas seguir.'
    choices:
    - text: Gracias, dame la llave.
      result: 1
    - text: Omitir esta parte y continuar.
      result: 2
  - id: gate
    speaker: gate
    camera: ots_speaker_close
    prompt: '¿Ves el barril a mi derecha? Es sólo decorado, no tienes que usarlo. Ahora vamos a cambiar lo que hay
      en esta calle: el barril desaparecerá, nosotros nos iremos y llegará otro instructor. Las calles serán las
      mismas. En el editor lo preparas con + Escena > Nuevo layout sobre este level y un evento Viaje. Así puedes
      reutilizar un lugar en distintos momentos de la historia.'
    choices:
    - text: Vale, veamos cómo cambia la calle.
      result: 1
    - text: Omitir esta parte y continuar.
      result: 2
  - id: lab
    speaker: lab
    camera: ots_speaker_close
    entry: opening
    nodes:
    - id: opening
      lines:
      - speaker: lab
        text: Aquí puedes probar cosas a tu aire. No hace falta que hagas nada de esto para seguir con los profesores.
          ¿Qué te apetece probar?
        motion: gesture10
      choices:
      - text: Movimiento y cámaras.
        goto: motion
      - text: Animaciones de conversación.
        goto: motions
      - text: Objetos y decisiones que se recuerdan.
        goto: objects
      - text: Ya volveré, gracias.
        result: 10
    - id: motion
      lines:
      - speaker: lab
        text: Ese paseante es sólo para nuestras pruebas. Podemos hacerlo caminar o detenerlo. También hay un travelling
          del juego original; ese ejemplo todavía necesita más pruebas.
        motion: gesture7
      choices:
      - text: Que empiece a caminar.
        result: 1
      - text: Que se detenga.
        result: 2
      - text: Pausar su AI.
        result: 3
      - text: Reanudar su AI.
        result: 4
      - text: Ver el travelling original (experimental).
        result: 5
      - text: Volver.
        goto: opening
    - id: motions
      lines:
      - speaker: lab
        text: Cada modelo tiene su propio archivo de movimientos. El motor usa hablar y escuchar automáticamente;
          aquí puedes probar los gestos que este personaje realmente tiene y ver su nombre en el editor.
        motion: gesture3
      choices:
      - text: Ver gesto 3.
        goto: gesture3
      - text: Ver gesto 7.
        goto: gesture7
      - text: Ver gesto 8.
        goto: gesture8
      - text: Ver gesto 9.
        goto: gesture9
      - text: Ver gesto 10.
        goto: gesture10
      - text: Volver.
        goto: opening
    - id: gesture3
      lines:
      - speaker: lab
        text: Este nodo reproduce el gesto 3. En el editor puedes cambiar Animación al hablar por otro movimiento
          disponible para este modelo.
        motion: gesture3
      choices:
      - text: Elegir otro movimiento.
        goto: motions
      - text: Volver al laboratorio.
        goto: opening
    - id: gesture7
      lines:
      - speaker: lab
        text: Este nodo reproduce el gesto 7. En el editor puedes cambiar Animación al hablar por otro movimiento
          disponible para este modelo.
        motion: gesture7
      choices:
      - text: Elegir otro movimiento.
        goto: motions
      - text: Volver al laboratorio.
        goto: opening
    - id: gesture8
      lines:
      - speaker: lab
        text: Este nodo reproduce el gesto 8. En el editor puedes cambiar Animación al hablar por otro movimiento
          disponible para este modelo.
        motion: gesture8
      choices:
      - text: Elegir otro movimiento.
        goto: motions
      - text: Volver al laboratorio.
        goto: opening
    - id: gesture9
      lines:
      - speaker: lab
        text: Este nodo reproduce el gesto 9. En el editor puedes cambiar Animación al hablar por otro movimiento
          disponible para este modelo.
        motion: gesture9
      choices:
      - text: Elegir otro movimiento.
        goto: motions
      - text: Volver al laboratorio.
        goto: opening
    - id: gesture10
      lines:
      - speaker: lab
        text: Este nodo reproduce el gesto 10. En el editor puedes cambiar Animación al hablar por otro movimiento
          disponible para este modelo.
        motion: gesture10
      choices:
      - text: Elegir otro movimiento.
        goto: motions
      - text: Volver al laboratorio.
        goto: opening
    - id: objects
      lines:
      - speaker: lab
        text: 'Acércate a la zona que hay un poco más allá de mí: aparecerá un libro que puedes recoger. En Debug
          > Leer trace queda anotado cuándo entras, sales y lo recoges. También puedes activar una flag: es una
          marca con la que la crónica recuerda lo que has hecho.'
      choices:
      - text: Voy a buscar el libro.
        result: 6
      - text: Activar la flag del laboratorio.
        result: 7
      - text: Desactivarla.
        result: 8
      - text: Volver.
        goto: opening
