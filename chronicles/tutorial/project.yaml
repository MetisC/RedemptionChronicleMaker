quests:
- id: guide
  title: Tutorial RCM · paso a paso
  description: Siete lecciones; sólo se muestra la actual.
  steps:
  - 1/7 · Tomás te espera delante de ti. Habla con él para empezar; los demás vendrán a esta misma esquina.
  - 2/7 · Ahora habla con Vera. Te enseñará los encuadres uno a uno. Pulsa Siguiente cuando quieras cambiar, o salta
    los demás.
  - '3/7 · Habla con Anezka: una puerta se abrirá y un personaje pasará por ella. La película dura doce segundos;
    puedes omitirla antes de empezar.'
  - 4/7 · Elena te dará una llave. Habla con ella y mira después tu inventario.
  - 5/7 · Habla con el agente y fíjate en el barril. Vais a cambiar lo que hay en la calle sin cambiar sus edificios.
  - 6/7 · El instructor puede hacer aparecer una rata cerca de ti. Pídeselo y mátala para seguir, o dile que prefieres
    omitir el combate.
  - 7/7 · Tomás ha vuelto para despedirse. Prueba a guardar y cargar la partida; después habla con él para terminar.
  reward_xp: 20
