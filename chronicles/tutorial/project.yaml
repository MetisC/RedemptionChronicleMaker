schema: 2
project_format: 9
chronicle:
  id: rcm_tutor
  name: RCM · Una carta al amanecer
  description: 'Tutorial 1.0: conversación, objetivo, trigger condicionado, película sobre el jugador, carta, journal,
    rata y llegada.'
entry: square
state:
  flags:
    go_to_square: 0
    square_reached: 1
    flag1: 2
    flag2: 3
    delivery_done: 4
scenes:
- id: square
  level:
    source: EastLondon
    environment_scene: EAST_28_1.nsd
  actors:
  - id: actor1
    name: '01 · Anezka: el encargo'
    template: Anezka
    transform:
      placement: absolute
      position:
      - -176
      - -612
      - 384
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: conv1
      when_flag: flag2
      then: to_elena
  - id: enemy1
    name: 05 · Una rata de las minas
    template: Rat
    transform:
      placement: absolute
      position:
      - -62
      - -1000
      - 384
      orientation:
      - 0
      - 0
      - 180
    behavior: enemy
  - id: actor2
    name: 'Tomás: ayuda y omitir combate'
    template: LonCiv1
    transform:
      placement: absolute
      position:
      - -176
      - -1080
      - 384
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: conv2
  objects:
  - id: marker
    name: 'Barril: acércate aquí'
    template: barrel1
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
  - id: object1
    name: Carta para Elena
    template: ledger
    transform:
      placement: absolute
      position:
      - -240
      - -950
      - 384
      orientation:
      - 0
      - 0
      - 180
    quest_item: true
  conversations:
  - id: conv1
    speaker: actor1
    prompt: 'Necesito que lleves una carta a Elena. ¿Ves el barril en la zona ancha de la calle, cerca de donde
      has aparecido? Está solo, separado de las paredes. Acércate al barril: allí te mostraré la carta. No tienes
      que pulsarlo; basta con caminar hasta él. Tu diario te recordará qué hacer.'
    choices:
    - text: Acepto el encargo. Voy al barril.
      result: 1
    - text: Ahora no.
      result: 2
    camera: ots_speaker_close
  - id: conv2
    speaker: actor2
    prompt: 'Recoge el libro de la calle: representa la carta. Después aparecerá una sola rata. Mátala y vuelve
      a Anezka. Si prefieres seguir sin combatir, puedo despejar el camino por ti.'
    choices:
    - text: Prefiero omitir el combate.
      result: 1
    - text: Lo intentaré yo.
      result: 2
    camera: ots_speaker_close
  - id: to_elena
    speaker: actor1
    prompt: El camino ya está libre. La carta se entrega hablando con Elena; no hace falta usar el libro en el inventario.
      Puedo llevarte hasta ella. Si ya se la has entregado, puedes visitarla otra vez.
    choices:
    - text: Llévame a Elena.
      result: 1
    - text: Todavía no.
      result: 2
    camera: ots_speaker_close
  events:
  - id: spawn1
    when: scene_start
    actions:
    - spawn: actor1
  - id: answer1
    when: conversation_ended
    actions:
    - set_flag: go_to_square
    conversation: conv1
    result: 1
    once: true
  - id: event1
    when: trigger_enter
    actions:
    - play_sequence: sequence1
    trigger: trigger1
    conditions:
    - flag: go_to_square
      is_set: true
    - flag: square_reached
      is_set: false
    once: true
  - id: end1
    when: sequence_ended
    actions:
    - set_flag: square_reached
    - advance_quest: quest1
    sequence: sequence1
    once: true
  - id: marker_spawn
    when: scene_start
    actions:
    - spawn: marker
  - id: event2
    when: scene_start
    actions:
    - start_quest: quest1
    once: true
  - id: spawn2
    when: state_changed
    actions:
    - spawn: object1
    conditions:
    - flag: square_reached
      is_set: true
    once: true
  - id: event3
    when: item_picked_up
    actions:
    - set_flag: flag1
    item: object1
    once: true
    conditions:
    - flag: square_reached
      is_set: true
  - id: spawn3
    when: item_picked_up
    actions:
    - spawn_encounter: encounter1
    once: true
    item: object1
    conditions:
    - flag: square_reached
      is_set: true
    - flag: flag2
      is_set: false
  - id: event4
    when: encounter_complete
    actions:
    - set_flag: flag2
    - reward_xp: 5
    - advance_quest: quest1
    encounter: encounter1
    once: true
  - id: event5
    when: trigger_enter
    actions:
    - travel:
        scene: home
        entry: entry1
    trigger: trigger2
    conditions:
    - flag: flag2
      is_set: true
    - flag: delivery_done
      is_set: false
    once: false
  - id: road_clear
    when: encounter_complete
    encounter: encounter1
    once: true
    actions:
    - show_note:
        title: La calle está libre
        text: 'Bien hecho. Ya puedes entregar la carta: no hace falta usar el libro en el inventario. Habla con
          Anezka, donde comenzó el encargo, y elige «Llévame a Elena».'
  - id: spawn4
    when: state_changed
    actions:
    - spawn: actor2
    conditions:
    - flag: square_reached
      is_set: true
    once: true
  - id: skip_combat
    when: conversation_ended
    conversation: conv2
    result: 1
    once: true
    conditions:
    - flag: flag2
      is_set: false
    actions:
    - give_item: object1
    - remove_encounter: encounter1
    - set_flag: flag2
    - advance_quest: quest1
  - id: talk_travel
    when: conversation_ended
    conversation: to_elena
    result: 1
    once: false
    conditions:
    - flag: flag2
      is_set: true
    actions:
    - travel:
        scene: home
        entry: entry1
  - id: welcome
    when: scene_start
    once: true
    actions:
    - take_item: object1
    - show_note:
        title: Una carta al amanecer
        text: 'Empiezas en una calle de Londres. Anezka está justo delante, a pocos pasos. Habla con ella para recibir
          el encargo.


          Puedes moverte, abrir el diario y guardar como en cualquier crónica. Sigue una instrucción cada vez. En
          el editor, Tutorial / Ayuda te lleva a los mismos elementos y abre sus asistentes.'
  triggers:
  - id: trigger1
    name: '02 · Acércate al barril: trigger condicionado'
    shape: sphere
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
    radius: 110
  - id: trigger2
    name: '06 · Vuelve a Anezka: viaje a Elena'
    shape: sphere
    transform:
      placement: absolute
      position:
      - -176
      - -612
      - 384
      orientation:
      - 0
      - 0
      - 0
    radius: 75
    once: false
  sequences:
  - id: sequence1
    name: '03 · Llegada del jugador: amplio a cercano'
    actor: Player
    shot: wide
    angle: high
    duration: 6.0
    steps:
    - at: 0
      actor: Player
      preset: aerial
      transition: 0
    - at: 3
      actor: Player
      preset: speaker_close
      transition: 1.5
    reference: actor1
  encounters:
  - id: encounter1
    name: A small encounter
    actors:
    - enemy1
  paths: []
  waypoints: []
  entries:
  - id: start
    name: Entrada del jugador
    transform:
      position:
      - -62
      - -768
      - 384
      orientation:
      - 0
      - 0
      - 180
  - id: entry1
    name: Arrival
    transform:
      placement: absolute
      position:
      - -62
      - -768
      - 384
      orientation:
      - 0
      - 0
      - 180
  default_entry: start
- id: home
  level:
    source: EastLondon
    environment_scene: EAST_28_1.nsd
  actors:
  - id: actor1
    name: '07 · Elena: entrega'
    template: LonCiv2
    transform:
      placement: absolute
      position:
      - -176
      - -612
      - 384
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: conv1
      when_flag: delivery_done
      then: delivered
  objects:
  - id: marker
    name: 'Barril: regreso a Anezka'
    template: barrel1
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
  conversations:
  - id: conv1
    speaker: actor1
    prompt: 'Gracias por traerla. Anezka me avisó de tu llegada. Abre tu diario: el encargo terminará cuando me
      entregues la carta. Después puedes guardar y volver a cargar para comprobar que no recibes el premio dos veces.
      Cuando termines, vuelve al lugar del barril para regresar a la calle de Anezka. El diario conservará lo que
      has hecho.'
    choices:
    - text: Aquí está la carta.
      result: 1
    - text: Un momento.
      result: 2
    camera: ots_speaker_close
  - id: delivered
    speaker: actor1
    prompt: Gracias otra vez. Ya tengo la carta y el encargo está terminado. Puedes guardar y explorar, o volver
      al barril para regresar a la calle de Anezka. Tu diario conservará la entrega.
    choices:
    - text: Hasta pronto.
      result: 1
    camera: ots_speaker_close
  events:
  - id: spawn1
    when: scene_start
    actions:
    - spawn: actor1
  - id: delivery
    when: conversation_ended
    conversation: conv1
    result: 1
    once: true
    conditions:
    - owns_item: square.object1
    actions:
    - take_item: square.object1
    - advance_quest: quest1
    - complete_quest: quest1
    - set_flag: delivery_done
  - id: marker_spawn
    when: scene_start
    actions:
    - spawn: marker
  - id: event1
    when: trigger_enter
    actions:
    - travel:
        scene: square
        entry: entry1
    trigger: trigger1
    conditions:
    - flag: delivery_done
      is_set: true
    once: false
  triggers:
  - id: trigger1
    name: 08 · Volver a la calle de Anezka
    shape: sphere
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
    radius: 110
    once: false
  sequences: []
  encounters: []
  paths: []
  waypoints: []
  entries:
  - id: start
    name: Entrada del jugador
    transform:
      position:
      - -62
      - -768
      - 384
      orientation:
      - 0
      - 0
      - 180
  - id: entry1
    name: Arrival
    transform:
      placement: absolute
      position:
      - -62
      - -768
      - 384
      orientation:
      - 0
      - 0
      - 180
  default_entry: start
quests:
- id: quest1
  title: Una carta al amanecer
  description: Anezka necesita que lleves una carta a Elena. Habla con ella y acércate al barril que está solo en
    la zona ancha de la calle, cerca del punto de inicio.
  steps:
  - 'Acepta el encargo de Anezka. Después camina hasta el barril, cerca de donde has aparecido: no hace falta pulsarlo.'
  - 'Recoge el libro que aparece al lado del barril: es la carta para Elena. No tienes que usarlo en el inventario.
    Despeja la calle de la rata, o pide ayuda a Tomás.'
  - Habla con Anezka y elige «Llévame a Elena». Allí habla con Elena y entrégale la carta.
  reward_xp: 20
resources:
  templates:
  - id: T_tutor_mentor
    base: LonCiv3
    mode: inherit
    properties:
      ai: AI_tutor
      script: RCMTutorActor
  - id: T_tutor_key
    base: BoneKey
    mode: inherit
    properties:
      item_type: 0
  - id: R_rcm_tutor_s0_npc_key
    base: T_tutor_key
    properties: {}
  - id: R_rcm_tutor_s0_npc_book
    base: ledger
    properties: {}
  - id: R_rcm_tutor_s0_key
    base: T_tutor_key
    properties: {}
  - id: R_rcm_tutor_s0_reward
    base: ledger
    properties: {}
  ai_profiles:
  - id: AI_tutor
    base: civilian
    properties:
      wanderRadius: 0
  scripts:
  - id: RCMTutorActor
    source: chronicles/tutorial/resources/RCMTutorActor.java
  textures: []
metadata:
  version: 1.0.0
build_options:
  debug: true
