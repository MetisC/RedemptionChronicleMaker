  conversations:
  - id: intro
    speaker: victoria
    prompt: 'Bienvenido al Taller del Narrador. Vamos a buscar un libro y volver para cerrar un pequeño encargo.
      Primero acepta y habla con la guía, a tu lado. Su laboratorio es opcional: puedes probar cámaras, música y
      recorridos antes de salir.'
    choices:
    - text: Acepto el encargo.
      result: 1
      set_flag: alliance
    - text: No quiero involucrarme.
      result: 2
    camera: ots_speaker_close
  - id: pact
    speaker: victoria
    prompt: Recuerdo nuestro pacto. La guía te lleva al archivo; después entrega el libro al testigo en el regreso.
    choices:
    - text: Seguimos juntos.
      result: 1
    - text: Me quedo aquí.
      result: 2
    camera: two_shot
  - id: guide
    speaker: guide
    prompt: 'Primero habla con Anezka. El combate es una estación opcional: sólo empieza si lo eliges expresamente.'
    choices:
    - text: Viajar al archivo.
      result: 1
    - text: Quedarme aquí.
      result: 2
    - text: 'Activar combate opcional: una rata básica.'
      result: 3
    - text: 'Laboratorio: ver los planos uno a uno.'
      result: 4
    - text: 'Laboratorio: animaciones.'
      result: 5
    - text: 'Laboratorio: recorrido y sonido.'
      result: 6
    - text: Omitir el combate y continuar.
      result: 7
    - text: 'Laboratorios opcionales: encuentros y cine.'
      result: 8
  - id: cleared
    speaker: guide
    prompt: El encuentro ha terminado; el premio se entrega una sola vez. Puedes seguir con el circuito.
    choices:
    - text: Viajar al archivo.
      result: 1
    - text: Quedarme aquí.
      result: 2
    - text: 'Laboratorio: ver los planos uno a uno.'
      result: 4
    - text: 'Laboratorio: animaciones.'
      result: 5
    - text: 'Laboratorio: recorrido y sonido.'
      result: 6
    - text: Omitir el combate y continuar.
      result: 7
