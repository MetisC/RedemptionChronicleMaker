  triggers: []
  encounters: []
  waypoints:
  - id: guard_a
    name: Guard departure
    transform:
      position:
      - 430
      - -900
      - -512
      orientation:
      - 0
      - 0
      - 0
  - id: guard_b
    name: Guard destination
    transform:
      position:
      - 430
      - -780
      - -488
      orientation:
      - 0
      - 0
      - 0
  - id: noise
    name: Distant sound
    transform:
      position:
      - 600
      - -750
      - -512
      orientation:
      - 0
      - 0
      - 0
  paths:
  - id: guard_walk
    name: The guard crosses the room
    actor: guard
    points:
    - guard_a
    - guard_b
    loop: false
    speed: 60
    tolerance: 24
  conversations:
  - id: welcome
    speaker: mentor
    camera: ots_speaker_close
    entry: hello
    nodes:
    - id: hello
      lines:
      - text: Come in. The keeper will make sure the refuge is safe. Stay with me; it should only take a moment.
        actions:
        - camera_shot:
            actor: mentor
            reference: Player
            preset: ots_speaker_close
        - look_at:
            actor: mentor
            target: Player
        - play_motion:
            actor: mentor
            motion: gesture1
      choices:
      - text: I am ready.
        result: 1
      - text: Skip the film and continue.
        result: 2
  - id: wait
    speaker: mentor
    camera: ots_speaker_close
    entry: hello
    nodes:
    - id: hello
      lines:
      - text: The entrance is just behind you. Point at the door marked Refuge and click it; walking past it will
          not start the scene.
      choices:
      - text: I will knock.
        result: 1
  - id: after
    speaker: mentor
    camera: ots_speaker_close
    entry: hello
    nodes:
    - id: hello
      lines:
      - text: Well done. It was only a rat, but we can rest here now. Come with me.
      choices:
      - text: Let us go.
        result: 1
  - id: waiting
    speaker: mentor
    camera: ots_speaker_close
    entry: hello
    nodes:
    - id: hello
      lines:
      - text: The keeper is still checking the room. Deal with the rat when it appears, then come back to me.
      choices:
      - text: Understood.
        result: 1
  sequences:
  - id: refuge_film
    name: The keeper checks the refuge
    actor: mentor
    shot: wide
    angle: high
    duration: 10
    steps:
    - at: 0
      actor: mentor
      reference: guard
      preset: aerial
      transition: 0
    cues:
    - at: 0
      actions:
      - look_at:
          actor: mentor
          target: guard
      - set_dynamic_light:
          entity: mentor
          color:
          - 1
          - 0.8
          - 0.5
          intensity: 1
          radius: 180
          style: constant
    - at: 1
      actions:
      - play_motion:
          actor: mentor
          motion: gesture1
    - at: 2
      actions:
      - start_patrol: guard_walk
    - at: 3
      actions:
      - play_sound:
          resource: wind_hollow_01
          waypoint: noise
          volume: 35
          min_distance: 50
          max_distance: 1000
    - at: 3.5
      actions:
      - play_camera_path:
          resource: rcm_refuge_cam
          speed: 50
    - at: 8.5
      actions:
      - camera_fade:
          initial: 255
          target: 0
          duration: 1
  events:
  - id: arrival
    when: scene_start
    once: true
    actions:
    - spawn: mentor
    - spawn: guard
    - start_quest: director
    - show_note:
        title: Arrival at the refuge
        text: You have reached the refuge. Turn towards the original door, hover to see Refuge, then click it. Elena
          will greet you. After the short film, defeat the rat and speak to her again.
  - id: click_refuge
    when: object_clicked
    object: refuge_door
    once: true
    actions:
    - set_flag: director_knock
    - control_original:
        level: RaveClub
        template: tracker_thing
        position:
        - 105.0
        - -1122.0
        - -368.0
        operation: hide
    - start_conversation: welcome
  - id: watch
    when: conversation_ended
    conversation: welcome
    result: 1
    once: false
    actions:
    - play_sequence: refuge_film
  - id: skip
    when: conversation_ended
    conversation: welcome
    result: 2
    once: false
    actions:
    - run_event: begin_guard
  - id: film_end
    when: sequence_ended
    sequence: refuge_film
    once: true
    actions:
    - run_event: begin_guard
  - id: begin_guard
    when: manual
    once: true
    actions:
    - advance_quest: director
    - set_flag: director_ready
    - spawn: rat
    - clear_dynamic_light: mentor
    - show_note:
        title: A small intruder
        text: A rat has slipped into the refuge. Defeat it, then speak to Elena. You can now move and use the interface
          normally.
  - id: rat_defeated
    when: actor_killed
    actor: rat
    once: true
    actions:
    - set_flag: director_fight
    - advance_quest: director
  - id: leave_refuge
    when: conversation_ended
    conversation: after
    result: 1
    once: true
    actions:
    - advance_quest: director
    - complete_quest: director
    - camera_fade:
        initial: 255
        target: 0
        duration: 0.5
    - travel:
        scene: quay
        entry: safe
  - id: mentor_start
    when: actor_clicked
    actor: mentor
    once: false
    conditions:
    - flag: director_knock
      is_set: false
    - flag: director_fight
      is_set: false
    actions:
    - start_conversation: wait
  - id: mentor_resume
    when: actor_clicked
    actor: mentor
    once: false
    conditions:
    - flag: director_knock
      is_set: true
    - flag: director_ready
      is_set: false
    - flag: director_fight
      is_set: false
    actions:
    - start_conversation: welcome
  - id: mentor_wait
    when: actor_clicked
    actor: mentor
    once: false
    conditions:
    - flag: director_ready
      is_set: true
    - flag: director_fight
      is_set: false
    actions:
    - start_conversation: waiting
  - id: mentor_after
    when: actor_clicked
    actor: mentor
    once: false
    conditions:
    - flag: director_fight
