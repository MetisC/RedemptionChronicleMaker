schema: 2
project_format: 10
chronicle:
  id: rcm_showcase
  name: RCM · Taller del Narrador
  description: Tres escenas, dos escenarios y un laboratorio opcional. Sigue el libro o explora cámaras, animaciones,
    recorridos y sonido.
entry: quay
state:
  flags:
    alliance: 1
    peaceful: 2
    finished: 3
    combat_done: 4
    visited0: 5
    visited1: 6
    visited2: 7
    done_flag1: 0
    lab_note: 10
    zone_left: 11
    clock_seen: 12
    rat_seen: 13
    lab_pickup: 14
    director_ready: 8
    director_fight: 9
    director_knock: 15
scenes:
- id: quay
  level:
    source: EastLondon
    name: El taller
    environment_scene: EAST_28_1.nsd
  actors:
  - id: victoria
    name: Anezka
    template: T_mini_victoria
    transform:
      placement: absolute
      position:
      - -176.0
      - -612.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    comment: '01 · Anezka: empieza aquí'
  - id: guide
    name: Guía
    template: LonCiv2
    transform:
      placement: absolute
      position:
      - -342.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: guide
      when_flag: combat_done
      then: cleared
    inventory:
    - lab_key
    comment: '02 · Guía: viaje y laboratorio opcional'
  - id: enemy1
    name: Rata de las minas
