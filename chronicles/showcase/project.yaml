  - id: lab
    speaker: guide
    camera: ots_speaker_close
    prompt: El recorrido lleva a la guía entre dos puntos de esta misma calle. Puedes iniciarlo, detenerlo y pausar
      su comportamiento. La música y el ambiente pertenecen a la escena; el trueno suena desde un punto concreto.
      Nada de esto es obligatorio para completar el encargo.
    choices:
    - text: Iniciar recorrido.
      result: 1
    - text: Detener recorrido y pausar comportamiento.
      result: 2
    - text: Activar comportamiento.
      result: 3
    - text: Reproducir música, ambiente y trueno.
      result: 4
    - text: Detener música y ambiente.
      result: 5
    - text: Volver al recorrido principal.
      result: 6
  - id: anim
    speaker: guide
    camera: ots_speaker_close
    entry: menu
    nodes:
    - id: menu
      lines:
      - text: Aquí sólo mostramos animaciones que existen en este modelo. Elige un gesto; al terminar puedes volver
          al menú o salir. En el editor se ajusta por nodo o por línea, en Propiedades.
      choices:
      - text: Reposo · stand · LilyTalk_listen.nad
        goto: m0
      - text: Hablar · talk · LilyTalk_long2.nad
        goto: m1
      - text: Escuchar · listen · LilyTalk_listen.nad
        goto: m2
      - text: Salir del laboratorio.
        result: 1
    - id: m0
      motion: stand
      lines:
      - text: Este es Reposo · stand · LilyTalk_listen.nad. No todos los personajes tienen las mismas animaciones.
      choices:
      - text: Ver otra animación.
        goto: menu
      - text: Terminar.
        result: 100
    - id: m1
      motion: talk
      lines:
      - text: Este es Hablar · talk · LilyTalk_long2.nad. No todos los personajes tienen las mismas animaciones.
      choices:
      - text: Ver otra animación.
        goto: menu
      - text: Terminar.
        result: 101
    - id: m2
      motion: listen
      lines:
      - text: Este es Escuchar · listen · LilyTalk_listen.nad. No todos los personajes tienen las mismas animaciones.
      choices:
      - text: Ver otra animación.
        goto: menu
      - text: Terminar.
        result: 102
  - id: dyn
    speaker: guide
    camera: ots_speaker_close
    prompt: Aquí puedes ver enemigos creados durante la partida. Primero salen dos ratas; al vencerlas aparece una
      rata con más vida. A la mitad llama un refuerzo. Esto es opcional y no cambia el encargo del libro.
    choices:
    - text: Probar el encuentro dinámico.
      result: 1
    - text: Parar el generador continuo.
      result: 2
    - text: Volver al taller.
      result: 3
    - text: Probar el generador continuo (máximo dos ratas).
      result: 4
  - id: dyn_hub
    speaker: guide
    camera: ots_speaker_close
    prompt: Los dos laboratorios son opcionales. Puedes probar enemigos dinámicos o visitar una pequeña escena dirigida,
      sin cambiar el encargo del libro.
    choices:
    - text: Encuentros dinámicos.
      result: 1
    - text: Cinematic Director Lab.
      result: 2
    - text: Volver.
      result: 3
