schema: 2
project_format: 9
chronicle:
  id: rcm_mini
  name: Las voces de Londres · Mini crónica
  description: Pacto, investigación, dos mapas, tres layouts, llave, libro y combate opcional con una rata.
entry: quay
state:
  flags:
    alliance: 1
    peaceful: 2
    finished: 3
    combat_done: 4
    visited0: 5
    visited1: 6
    visited2: 7
    done_flag1: 0
scenes:
- id: quay
  level:
    source: EastLondon
    name: 'Londres: el pacto'
    environment_scene: EAST_28_1.nsd
  actors:
  - id: victoria
    name: Victoria · empieza aquí
    template: T_mini_victoria
    transform:
      placement: absolute
      position:
      - -176.0
      - -612.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
  - id: guide
    name: Guía · viajes y combate opcional
    template: businessWoman
    transform:
      placement: absolute
      position:
      - -342.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: guide
      when_flag: combat_done
      then: cleared
  - id: enemy1
    name: Rata de las minas · combate fácil y opcional
    template: Rat
    transform:
      placement: absolute
      position:
      - -342.0
      - -1018.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: enemy
  objects: []
  conversations:
  - id: intro
    speaker: victoria
    prompt: Un libro puede resolver nuestra deuda. Acepta el encargo y la guía te llevará al archivo. Puedes rechazarlo
      y volver a hablar sin perder los controles.
    choices:
    - text: Acepto el encargo.
      result: 1
      set_flag: alliance
    - text: No quiero involucrarme.
      result: 2
    camera: native
  - id: pact
    speaker: victoria
    prompt: Recuerdo nuestro pacto. La guía te lleva al archivo; después entrega el libro al testigo en el regreso.
    choices:
    - text: Seguimos juntos.
      result: 1
    - text: Me quedo aquí.
      result: 2
    camera: two_shot
  - id: guide
    speaker: guide
    prompt: 'Primero habla con Victoria. El combate es una estación opcional: sólo empieza si lo eliges expresamente.'
    choices:
    - text: Viajar al archivo.
      result: 1
    - text: Quedarme aquí.
      result: 2
    - text: 'Activar combate opcional: una rata básica.'
      result: 3
  - id: cleared
    speaker: guide
    prompt: El encuentro ha terminado; el premio se entrega una sola vez. Puedes seguir con el circuito.
    choices:
    - text: Viajar al archivo.
      result: 1
    - text: Quedarme aquí.
      result: 2
  events:
  - id: arrival
    when: scene_start
    actions:
    - spawn: victoria
    - spawn: guide
    - start_music: London_Hub
    - start_ambient: amb_londonStreet
    - start_patrol: guide_walk
  - id: new
    when: actor_clicked
    actions:
    - start_conversation: intro
    actor: victoria
    conditions:
    - flag: alliance
      is_set: false
  - id: remember
    when: actor_clicked
    actions:
    - start_conversation: pact
    actor: victoria
    conditions:
    - flag: alliance
      is_set: true
  - id: accept
    when: conversation_ended
    actions:
    - start_quest: ledger
    - advance_quest: ledger
    - start_quest: debt
    conversation: intro
    result: 1
    once: true
  - id: to_archive
    when: conversation_ended
    actions:
    - travel:
        scene: archive
        entry: safe
    conversation: guide
    result: 1
    once: false
    conditions:
    - flag: alliance
      is_set: true
  - id: cleared_trip
    when: conversation_ended
    actions:
    - travel:
        scene: archive
        entry: safe
    conversation: cleared
    result: 1
    once: false
    conditions:
    - flag: alliance
      is_set: true
  - id: combat
    when: conversation_ended
    actions:
    - spawn_encounter: optional_combat
    conversation: guide
    result: 3
    once: true
  - id: combat_done
    when: encounter_complete
    actions:
    - set_flag: combat_done
    - reward_xp: 100
    encounter: optional_combat
  - id: arrival_trigger
    when: trigger_enter
    actions:
    - set_flag: visited0
    trigger: arrival_zone
  - id: end1
    when: sequence_ended
    actions:
    - set_flag: done_flag1
    sequence: sequence1
    once: true
  - id: event1
    when: trigger_enter
    actions:
    - play_sequence: sequence1
    trigger: trigger1
    conditions: []
    once: true
  triggers:
  - id: arrival_zone
    name: Zona de llegada
    shape: box
    transform:
      placement: absolute
      position:
      - -176
      - -768
      - 444
      orientation:
      - 0
      - 0
      - 0
    size:
    - 160
    - 160
    - 120
    once: true
  - id: trigger1
    name: Arrival area
    shape: sphere
    transform:
      placement: absolute
      position:
      - -342
      - -950
      - 384
      orientation:
      - 0
      - 0
      - 0
    radius: 90
  encounters:
  - id: optional_combat
    name: Una rata · combate opcional
    actors:
    - enemy1
  sequences:
  - id: sequence1
    name: Llegada al muelle
    actor: Player
    shot: wide
    angle: high
    duration: 6
    steps:
    - at: 0
      actor: Player
      preset: aerial
      transition: 0
    - at: 3
      actor: Player
      preset: speaker_close
      transition: 1.5
    reference: victoria
  entries:
  - id: safe
    name: Inicio del jugador · calle de EastLondon
    transform:
      placement: absolute
      position:
      - -176.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 0
  default_entry: safe
  waypoints:
  - id: guide_a
    name: 'Guía: inicio'
    transform:
      placement: absolute
      position:
      - -342.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
  - id: guide_b
    name: 'Guía: vuelta'
    transform:
      placement: absolute
      position:
      - -342.0
      - -878.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
  paths:
  - id: guide_walk
    name: Paseo corto de la guía
    actor: guide
    points:
    - guide_a
    - guide_b
    loop: true
    speed: 90
    tolerance: 24
- id: archive
  level:
    source: GunHaven
    name: El archivo de la deuda
    environment_scene: GUNH_LOT_1_1.nsd
  actors:
  - id: archivist
    name: Archivera · elige una rama
    template: businessWoman
    transform:
      placement: absolute
      position:
      - 200.0
      - 944.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: ledger
  - id: keeper
    name: Custodia · regreso y cámara
    template: businessWoman
    transform:
      placement: absolute
      position:
      - 340.0
      - 850.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: back
  objects:
  - id: book
    name: El libro de la deuda
    template: I_mini_ledger
    quest_item: true
    transform:
      placement: absolute
      position:
      - 300.0
      - 900.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
  - id: key
    name: Llave del regreso
    template: IronKeyLondon
    transform:
      placement: absolute
      position:
      - 300.0
      - 900.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
  conversations:
  - id: ledger
    speaker: archivist
    prompt: Elige cómo recuperar el libro. La negociación y la intimidación llevan a respuestas distintas en el
      regreso. Sólo recibirás un libro.
    choices:
    - text: Negociar y recibir el libro.
      result: 1
    - text: Me voy.
      result: 2
    - text: Intimidar y recibir el libro.
      result: 3
  - id: back
    speaker: keeper
    prompt: Cuando tengas el libro, te llevaré al regreso. Allí te espera el testigo. La cámara es una prueba aparte
      y devuelve el control tras siete segundos; incluye tres planos y mi recorrido.
    choices:
    - text: Viajar al regreso.
      result: 1
    - text: Quedarme aquí.
      result: 2
    - text: Probar plano y sonido situados.
      result: 3
  events:
  - id: arrival
    when: scene_start
    actions:
    - spawn: archivist
    - spawn: keeper
    - start_music: Haven
  - id: peace
    when: conversation_ended
    actions:
    - set_flag: peaceful
    - give_item: key
    - give_item: book
    - advance_quest: ledger
    - advance_quest: debt
    conversation: ledger
    result: 1
    once: true
    conditions:
    - quest: ledger
      step: 1
  - id: force
    when: conversation_ended
    actions:
    - clear_flag: peaceful
    - give_item: key
    - give_item: book
    - advance_quest: ledger
    - advance_quest: debt
    conversation: ledger
    result: 3
    once: true
    conditions:
    - quest: ledger
      step: 1
  - id: to_return
    when: conversation_ended
    actions:
    - travel:
        scene: return
        entry: safe
    conversation: back
    result: 1
    once: false
    conditions:
    - owns_item: book
    - owns_item: key
  - id: camera
    when: conversation_ended
    actions:
    - play_sequence: two_shot
    - play_sound:
        resource: thunder_01
        waypoint: sound
        volume: 60
        min_distance: 128
        max_distance: 512
    conversation: back
    result: 3
    once: false
  - id: arrival_trigger
    when: trigger_enter
    actions:
    - set_flag: visited1
    trigger: arrival_zone
  triggers:
  - id: arrival_zone
    name: Zona de llegada
    shape: box
    transform:
      placement: absolute
      position:
      - 200
      - 790
      - 60
      orientation:
      - 0
      - 0
      - 0
    size:
    - 160
    - 160
    - 120
    once: true
  encounters: []
  sequences:
  - id: two_shot
    name: Dos personajes
    actor: keeper
    duration: 7
    shot: medium
    angle: medium
    preset: two_shot
    steps:
    - at: 0
      actor: keeper
      preset: two_shot
    - at: 2
      actor: archivist
      preset: speaker_close
      transition: 0.6
    - at: 4
      actor: keeper
      preset: full
      transition: 1.0
    move_path: keeper_walk
  entries:
  - id: safe
    name: Llegada segura
    transform:
      placement: absolute
      position:
      - 200.0
      - 790.0
      - 0.0
      orientation:
      - 0
      - 0
      - 0
  default_entry: safe
  waypoints:
  - id: sound
    name: Fuente de sonido de prueba
    transform:
      placement: absolute
      position:
      - 200.0
      - 790.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
  - id: keeper_a
    name: 'Custodia: inicio'
    transform:
      placement: absolute
      position:
      - 340.0
      - 850.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
  - id: keeper_b
    name: 'Custodia: destino'
    transform:
      placement: absolute
      position:
      - 340.0
      - 960.0
      - 0.0
      orientation:
      - 0
      - 0
      - 180
  paths:
  - id: keeper_walk
    name: Cutscene · custodia en movimiento
    actor: keeper
    points:
    - keeper_a
    - keeper_b
    loop: false
    speed: 60
    tolerance: 24
- id: return
  level:
    source: EastLondon
    name: 'Londres: las voces recuerdan'
    environment_scene: EAST_28_1.nsd
  actors:
  - id: witness
    name: Testigo · entrega y final
    template: businessWoman
    transform:
      placement: absolute
      position:
      - -176.0
      - -612.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
  - id: courier
    name: Mensajera · vuelve al comienzo
    template: businessWoman
    transform:
      placement: absolute
      position:
      - -342.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: back
  objects: []
  conversations:
  - id: peace
    speaker: witness
    prompt: La archivera dice que elegiste negociar. Entrega el libro y dejaremos saldada la deuda.
    choices:
    - text: Entregar el libro y cerrar ambas quests.
      result: 1
    - text: Todavía no.
      result: 2
  - id: force
    speaker: witness
    prompt: La archivera recuerda tu intimidación. Entrega el libro; la deuda acabará, aunque Londres recordará
      cómo actuaste.
    choices:
    - text: Entregar el libro y cerrar ambas quests.
      result: 1
    - text: Todavía no.
      result: 2
  - id: final
    speaker: witness
    prompt: Las voces de Londres recuerdan tu decisión. Ambas quests han terminado y la recompensa sólo se entrega
      una vez. Puedes guardar y volver al principio con la mensajera.
    choices:
    - text: Terminar la conversación.
      result: 1
    - text: Volver a hablar después.
      result: 2
  - id: back
    speaker: courier
    prompt: Esta escena usa la misma geometría de EastLondon y tiene sus propios NPC. Puedes volver al inicio para
      comprobar el pacto y repetir el circuito.
    choices:
    - text: Volver al comienzo.
      result: 1
    - text: Quedarme aquí.
      result: 2
  events:
  - id: arrival
    when: scene_start
    actions:
    - spawn: witness
    - spawn: courier
    - start_patrol: courier_walk
  - id: peace
    when: actor_clicked
    actions:
    - start_conversation: peace
    actor: witness
    conditions:
    - flag: peaceful
      is_set: true
    - flag: finished
      is_set: false
  - id: force
    when: actor_clicked
    actions:
    - start_conversation: force
    actor: witness
    conditions:
    - flag: peaceful
      is_set: false
    - flag: finished
      is_set: false
  - id: final
    when: actor_clicked
    actions:
    - start_conversation: final
    actor: witness
    conditions:
    - flag: finished
      is_set: true
  - id: back
    when: conversation_ended
    actions:
    - travel:
        scene: quay
        entry: safe
    conversation: back
    result: 1
    once: false
  - id: finish_peace
    when: conversation_ended
    actions:
    - take_item: archive.book
    - advance_quest: ledger
    - complete_quest: ledger
    - advance_quest: debt
    - complete_quest: debt
    - set_flag: finished
    - start_music: Haven
    conversation: peace
    result: 1
    once: true
    conditions:
    - quest: ledger
      step: 2
    - owns_item: archive.book
    - flag: visited0
      is_set: true
    - flag: visited1
      is_set: true
    - flag: visited2
      is_set: true
  - id: finish_force
    when: conversation_ended
    actions:
    - take_item: archive.book
    - advance_quest: ledger
    - complete_quest: ledger
    - advance_quest: debt
    - complete_quest: debt
    - set_flag: finished
    - start_music: Haven
    conversation: force
    result: 1
    once: true
    conditions:
    - quest: ledger
      step: 2
    - owns_item: archive.book
    - flag: visited0
      is_set: true
    - flag: visited1
      is_set: true
    - flag: visited2
      is_set: true
  - id: arrival_trigger
    when: trigger_enter
    actions:
    - set_flag: visited2
    trigger: arrival_zone
  triggers:
  - id: arrival_zone
    name: Zona de llegada
    shape: box
    transform:
      placement: absolute
      position:
      - -176
      - -768
      - 444
      orientation:
      - 0
      - 0
      - 0
    size:
    - 160
    - 160
    - 120
    once: true
  encounters: []
  sequences: []
  entries:
  - id: safe
    name: Inicio del jugador · calle de EastLondon
    transform:
      placement: absolute
      position:
      - -176.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 0
  default_entry: safe
  waypoints:
  - id: courier_a
    name: 'Mensajera: inicio'
    transform:
      placement: absolute
      position:
      - -342.0
      - -768.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
  - id: courier_b
    name: 'Mensajera: vuelta'
    transform:
      placement: absolute
      position:
      - -342.0
      - -878.0
      - 384.0
      orientation:
      - 0
      - 0
      - 180
  paths:
  - id: courier_walk
    name: Paseo corto de la mensajera
    actor: courier
    points:
    - courier_a
    - courier_b
    loop: true
    speed: 90
    tolerance: 24
quests:
- id: ledger
  title: El libro de la deuda
  description: Recupera y entrega el libro.
  steps:
  - Aceptar el encargo
  - Recuperar el libro
  - Entregarlo al testigo
  reward_xp: 500
- id: debt
  title: Una deuda, dos caminos
  description: Elige negociación o intimidación; la crónica recordará tu decisión.
  steps:
  - Elegir cómo recuperar el libro
  - Sellar el pacto
  reward_xp: 150
resources:
  templates:
  - id: T_mini_victoria
    base: businessWoman
    mode: inherit
    properties:
      ai: AI_mini
      script: RCMMiniActor
  - id: I_mini_ledger
    base: ledger
    mode: inherit
    properties: {}
  ai_profiles:
  - id: AI_mini
    base: civilian
    properties:
      wanderRadius: 0
  scripts:
  - id: RCMMiniActor
    source: chronicles/mini_chronicle/resources/RCMMiniActor.java
  textures: []
metadata:
  author: Redemption Chronicle Maker
  version: 0.9.6
  requires_game: Redemption 1.1
  description: Prueba manual aplazada; generación y compilación comprobadas.
  dependencies: []
build_options:
  debug: true
playtests:
- id: story
  name: Mini crónica · recorrido completo
  instructions: 'Tutorial / Ayuda → guía local. Victoria acepta; guía lleva al archivo; archivera entrega libro
    y llave; custodia vuelve al muelle; testigo recibe libro. Guarda y carga, vuelve a entrar y comprueba que no
    duplica premios. Combate de una rata sólo si lo eliges. Cámara de 7 s: tres planos y custodia caminando.'
authoring:
  recipes:
  - id: trigger_cin1
    type: trigger_cinematic
    version: 1
    scene: quay
    refs:
      trigger:
        collection: triggers
        id: trigger1
        scene: quay
      sequence:
        collection: sequences
        id: sequence1
        scene: quay
      done_flag:
        collection: flags
        id: done_flag1
      end_event:
        collection: events
        id: end1
        scene: quay
      event:
        collection: events
        id: event1
        scene: quay
