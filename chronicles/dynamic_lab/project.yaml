schema: 2
project_format: 10
chronicle:
  id: rcm_dynamic
  name: RCM · Dynamic Encounter Lab
  description: 'Opcional: oleadas, refuerzos, jefe por fases, generador continuo y guardado.'
entry: lab
state:
  flags:
    armed: 0
quests:
- id: combat
  title: Encuentros dinámicos
  description: Habla con Anezka para empezar. Sólo aparecen enemigos si aceptas.
  steps:
  - Limpia las dos oleadas.
  - Vence a la rata por fases.
  reward_xp: 0
resources: {}
metadata:
  version: 1.0.0
scenes:
- id: lab
  level:
    source: EastLondon
    environment_scene: EAST_28_1.nsd
  actors:
  - id: mentor
    name: 'Anezka: laboratorio'
    template: Anezka
    transform:
      placement: absolute
      position:
      - -176
      - -612
      - 384
      orientation:
      - 0
      - 0
      - 180
    behavior: npc
    conversation:
      default: lab
  objects:
  - id: barrel
    name: Barril del combate
    template: barrel1
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
  conversations:
  - id: lab
    speaker: mentor
    camera: ots_speaker_close
    prompt: Este laboratorio es independiente del encargo de la carta. Para las oleadas, acepta y acércate al barril
      del combate. Puedes probar oleadas, un jefe con refuerzos o un generador continuo. Guarda a mitad de combate
      y carga para comprobar que conserva el grupo.
    choices:
    - text: Preparar las oleadas. Después iré al barril.
      result: 1
    - text: Probar el generador continuo (máximo tres ratas).
      result: 2
    - text: Parar el generador continuo.
      result: 3
    - text: Pausarlo.
      result: 4
    - text: Reanudarlo.
      result: 5
    - text: No empezar todavía.
      result: 6
  entries:
  - id: safe
    name: Entrada del jugador
    transform:
      position:
      - -62
      - -768
      - 384
      orientation:
      - 0
      - 0
      - 180
  default_entry: safe
  waypoints:
  - id: spawn_a
    name: 'Aparición: posición de la rata del tutorial'
    transform:
      placement: absolute
      position:
      - -62
      - -1000
      - 384
      orientation:
      - 0
      - 0
      - 180
  paths: []
  triggers:
  - id: arena
    name: Zona del barril
    shape: sphere
    radius: 120
    transform:
      placement: absolute
      position:
      - -320
      - -850
      - 384
      orientation:
      - 0
      - 0
      - 0
    once: false
  encounters: []
  sequences: []
  generators:
  - id: waves
    name: Dos oleadas de ratas
    mode: waves
    max_alive: 3
    waves:
    - groups:
      - role: rats
        template: Rat
        count: 3
    - delay: 2
      groups:
      - role: rats
        template: Rat
        count: 2
    spawn_points:
    - spawn_a
    persistence: once
    visual: barrel
  - id: boss
    name: 'Rata: jefe por fases'
    mode: boss
    max_alive: 1
    waves:
    - groups:
      - role: boss
        template: Rat
        count: 1
        health_multiplier: 10
    boss:
      role: boss
    phases:
    - id: half
      percent: 50
      actions:
      - start_generator: adds
    - id: quarter
      percent: 25
      actions:
      - play_sound:
          resource: thunder_01
          waypoint: spawn_a
          volume: 60
          min_distance: 128
          max_distance: 512
    spawn_points:
    - spawn_a
    persistence: once
  - id: adds
    name: Dos refuerzos
    mode: reinforcements
    max_alive: 2
    waves:
    - groups:
      - role: adds
        template: Rat
        count: 2
    spawn_points:
    - spawn_a
    persistence: once
  - id: continuous
    name: 'Continuo: máximo tres vivos'
    mode: continuous
    max_alive: 3
    interval: 5
    waves:
    - groups:
      - role: rats
        template: Rat
        count: 1
    spawn_points:
    - spawn_a
    persistence: once
  events:
  - id: welcome
    when: scene_start
    actions:
    - spawn: mentor
    - spawn: barrel
  - id: begin
    when: conversation_ended
    conversation: lab
    result: 1
    once: true
    actions:
    - start_quest: combat
    - set_flag: armed
  - id: boss
    when: generator_complete
    generator: waves
    once: true
    actions:
    - advance_quest: combat
    - start_generator: boss
  - id: complete
    when: generator_complete
    generator: boss
    once: true
    actions:
    - stop_generator: continuous
    - stop_generator: adds
    - advance_quest: combat
    - complete_quest: combat
  - id: arena
    when: trigger_enter
    trigger: arena
    once: false
    conditions:
    - flag: armed
      is_set: true
    actions:
    - start_generator: waves
  - id: control2
    when: conversation_ended
    conversation: lab
    result: 2
    once: false
    actions:
    - start_generator: continuous
  - id: control3
    when: conversation_ended
    conversation: lab
    result: 3
    once: false
    actions:
    - stop_generator: continuous
  - id: control4
    when: conversation_ended
    conversation: lab
    result: 4
    once: false
    actions:
    - pause_generator: continuous
  - id: control5
    when: conversation_ended
    conversation: lab
    result: 5
    once: false
    actions:
    - resume_generator: continuous
