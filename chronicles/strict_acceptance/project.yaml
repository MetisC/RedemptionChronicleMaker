        initial: 0
        target: 255
        duration: 1
    - show_note:
        title: Safe before dawn
        text: You reached the refuge. The journal records your arrival and the rat is behind you. This small chronicle
          was authored in RCM, including its camera path; the original geometry has not changed. The floating cargo
          uses the original ClassBobbing constructor, linked to an object and a named movement frame. The two supply
          barrels compare inherited treasure with class 230. These native behaviours require manual observation;
          this example does not certify them.
  waypoints:
  - id: interest
    name: 'Optional native AI interest spot: group 8'
    interest_group: 8
    transform:
      position:
      - 430
      - -900
      - -512
      orientation:
      - 0
      - 0
      - 0
